  <circle cx="300" cy="260" r="110" fill="url(#ladduGrad)"/>
  <!-- Pistachios / Cardamom bits -->
  <g fill="#43a047">
    <ellipse cx="270" cy="220" rx="8" ry="4" transform="rotate(-20 270 220)"/>
    <ellipse cx="330" cy="240" rx="7" ry="3" transform="rotate(30 330 240)"/>
    <ellipse cx="290" cy="290" rx="8" ry="4" transform="rotate(10 290 290)"/>
    <ellipse cx="340" cy="190" rx="6" ry="3" transform="rotate(-40 340 190)"/>
  </g>
  <text x="300" y="550" font-family="'Fraunces', Georgia, serif" font-size="22" font-weight="bold" fill="#ffd54f" text-anchor="middle" letter-spacing="2">LADDU AUCTION LEDGER</text>
</svg>